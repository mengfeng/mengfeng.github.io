<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="页面暂时找不到。返回艺术码畜首页，或浏览文章归档。">
  <title>页面未找到 | 艺术码畜</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: linear-gradient(155deg, #071923, #123f52 70%, #276277); color: #f5fbff; }
    main { width: min(100% - 48px, 720px); padding: 72px 0; }
    .home { display: inline-flex; align-items: center; gap: 10px; color: #d4edf7; font-size: 16px; text-decoration: none; }
    .home:hover, .home:focus-visible { color: #fff; text-decoration: underline; text-underline-offset: 5px; }
    .mark { width: 24px; height: 24px; }
    .code { margin: 64px 0 10px; color: #c3eaf2; font-size: clamp(72px, 18vw, 144px); font-weight: 700; letter-spacing: -.04em; line-height: 1; }
    h1 { margin: 0 0 16px; font-size: clamp(28px, 5vw, 40px); line-height: 1.35; }
    p { max-width: 40ch; margin: 0; color: #d4e6ed; font-size: 17px; line-height: 1.8; }
    nav { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 36px; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 18px; border: 1px solid #a5dbe8; border-radius: 8px; color: #f5fbff; text-decoration: none; }
    nav a:hover { background: #e6f6fb; color: #123f52; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    @media (max-width: 520px) { main { padding: 48px 0; } .code { margin-top: 72px; } }
  </style>
</head>
<body>
  <main>
    <a class="home" href="/" aria-label="返回艺术码畜首页">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 15c3.2-5 6.8-5 10 0s5.4 5 8 0M3 20c3.2-5 6.8-5 10 0s5.4 5 8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      艺术码畜
    </a>
    <div class="code" aria-hidden="true">404</div>
    <h1>这篇内容暂时找不到</h1>
    <p>可能是链接写错了，或文章地址发生变化。你可以回到首页查看最新文章，也可以从归档继续找。</p>
    <nav aria-label="继续浏览">
      <a href="/">看最新文章</a>
      <a href="/archives/">浏览文章归档</a>
    </nav>
  </main>
</body>
</html>
