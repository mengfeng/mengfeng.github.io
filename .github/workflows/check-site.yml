name: Check static site

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check site metadata, references, sitemap, and search index
        run: python scripts/check_site.py
      - name: Check analytics and search transformations
        run: python -m unittest discover -s tests
