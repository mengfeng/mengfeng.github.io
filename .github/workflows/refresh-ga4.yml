name: Refresh GA4 snapshot

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      auth_only:
        description: Verify Google Cloud authentication without reading GA4
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  refresh:
    if: >-
      github.repository == 'mengfeng/mengfeng.github.io' &&
      github.ref == 'refs/heads/master' &&
      vars.GA4_WORKLOAD_IDENTITY_PROVIDER != '' &&
      (vars.GA4_REFRESH_ENABLED == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.auth_only == true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GA4_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: blog-ga4-reader@project-687b3932-d9fa-48af-af1.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          access_token_lifetime: 600s
          create_credentials_file: false
      - name: Confirm short-lived token
        if: inputs.auth_only == true
        env:
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          test -n "$GA4_ACCESS_TOKEN"
          echo 'OIDC authentication succeeded.'
      - uses: actions/setup-python@v6
        if: inputs.auth_only != true
        with:
          python-version: '3.12'
      - name: Query GA4 and validate the report
        if: inputs.auth_only != true
        env:
          GA4_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/update_ga4_stats.py
      - name: Check the generated site
        if: inputs.auth_only != true
        run: python scripts/check_site.py
      - name: Commit a changed snapshot
        if: inputs.auth_only != true
        run: |
          if git diff --quiet -- data/analytics.json; then
            echo 'GA4 snapshot is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/analytics.json
          git commit -m 'Update GA4 public snapshot'
          git push origin HEAD:master
