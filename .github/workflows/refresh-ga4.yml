name: Refresh GA4 snapshot

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'mengfeng/mengfeng.github.io'
    runs-on: ubuntu-latest
    env:
      GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Explain missing credential
        if: env.GA4_SERVICE_ACCOUNT_JSON == ''
        run: echo 'GA4 refresh is not active until GA4_SERVICE_ACCOUNT_JSON is configured.'
      - uses: actions/setup-python@v5
        if: env.GA4_SERVICE_ACCOUNT_JSON != ''
        with:
          python-version: '3.12'
      - name: Install GA4 authentication library
        if: env.GA4_SERVICE_ACCOUNT_JSON != ''
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2,<3'
      - name: Query GA4 and validate the report
        if: env.GA4_SERVICE_ACCOUNT_JSON != ''
        run: python scripts/update_ga4_stats.py
      - name: Check the generated site
        if: env.GA4_SERVICE_ACCOUNT_JSON != ''
        run: python scripts/check_site.py
      - name: Commit a changed snapshot
        if: env.GA4_SERVICE_ACCOUNT_JSON != ''
        run: |
          if git diff --quiet -- data/analytics.json; then
            echo 'GA4 snapshot is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/analytics.json
          git commit -m 'Update GA4 public snapshot'
          git push origin HEAD:master
